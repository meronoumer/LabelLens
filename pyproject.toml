[project]
name = "labellens"
version = "0.1.0"
description = "Research prototype: a tool-using agent for packaged-food dietary questions"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",  # Responses API + structured outputs (text.format / json_schema)
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["labellens*"]
